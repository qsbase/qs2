name: qdata-cpp Linux CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'man/**'
      - 'vignettes/**'
      - 'README.md'
      - 'ChangeLog'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux:
    name: Ubuntu (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: TBB ON
            qdata_use_tbb: "ON"
          - label: TBB OFF
            qdata_use_tbb: "OFF"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libzstd-dev libtbb-dev libicu-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R test packages
        run: |
          Rscript -e "install.packages(c('Rcpp', 'RcppParallel', 'stringfish', 'stringi', 'data.table', 'tibble'), Ncpus = max(1L, parallel::detectCores()))"

      # Build qs2 from this checkout, not from CRAN or a clone of main: the C++
      # tests round trip against the R package, so both halves have to come from
      # the same tree or they can disagree about the format.
      - name: Install qs2 from this checkout
        run: R CMD INSTALL .

      # library(), not requireNamespace(quietly = TRUE): a package can install and
      # still fail to load, and the quiet form hides why.
      - name: Verify R test packages
        run: |
          Rscript -e "for (p in c('qs2', 'stringi', 'stringfish')) { cat('loading', p, '... '); library(p, character.only = TRUE); cat(format(packageVersion(p)), 'ok\n') }"

      - name: Show toolchain
        run: |
          cmake --version
          ninja --version
          ctest --version
          c++ --version
          Rscript --version

      - name: Configure
        run: |
          cmake -S inst/include/qdata-cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQDATA_USE_TBB=${{ matrix.qdata_use_tbb }} \
            -DQDATA_BUILD_BENCHMARKS=ON \
            -DQDATA_BUILD_EXAMPLES=ON \
            -DQDATA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QS_EXTENDED_TESTS: "1"
        run: ctest --test-dir build --output-on-failure -V
