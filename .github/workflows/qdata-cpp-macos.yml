name: qdata-cpp macOS CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'man/**'
      - 'vignettes/**'
      - 'README.md'
      - 'ChangeLog'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  macos:
    name: macOS (${{ matrix.label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: TBB ON
            qdata_use_tbb: "ON"
          - label: TBB OFF
            qdata_use_tbb: "OFF"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew update
          brew install ninja pkg-config zstd tbb

      - name: Expose Homebrew dependency prefixes
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix zstd)/lib/pkgconfig:$(brew --prefix tbb)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix zstd);$(brew --prefix tbb)" >> "$GITHUB_ENV"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R test packages
        run: |
          Rscript -e "install.packages(c('Rcpp', 'RcppParallel', 'stringfish', 'stringi', 'data.table', 'tibble'), repos = 'https://cloud.r-project.org', Ncpus = max(1L, parallel::detectCores()))"

      # Build qs2 from this checkout, not from CRAN or a clone of main: the C++
      # tests round trip against the R package, so both halves have to come from
      # the same tree or they can disagree about the format.
      - name: Install qs2 from this checkout
        run: R CMD INSTALL .

      # library(), not requireNamespace(quietly = TRUE): a package can install and
      # still fail to load, and the quiet form hides why.
      - name: Verify R test packages
        run: |
          Rscript -e "for (p in c('qs2', 'stringi', 'stringfish')) { cat('loading', p, '... '); library(p, character.only = TRUE); cat(format(packageVersion(p)), 'ok\n') }"

      - name: Show toolchain
        run: |
          cmake --version
          ninja --version
          ctest --version
          c++ --version
          Rscript --version

      - name: Configure
        run: |
          cmake -S inst/include/qdata-cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQDATA_USE_TBB=${{ matrix.qdata_use_tbb }} \
            -DQDATA_BUILD_BENCHMARKS=ON \
            -DQDATA_BUILD_EXAMPLES=ON \
            -DQDATA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QS_EXTENDED_TESTS: "1"
        run: ctest --test-dir build --output-on-failure -V
